name: Newsletter

# Elke maandag; run-edition.mjs bouwt alleen in EVEN ISO-weken (tenzij force=true).
# Drie edities: hoofd (NL/BE/FR/DE + UK/DK), Frankrijk (FR), Duitsland (DE).
# Hoofdmail draait EERST en zonder continue-on-error; fr/de erna op continue-on-error.
# test_to: overschrijft alle ontvangers (voor veilig testen naar je eigen inbox).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      send:
        description: "Ook verzenden?"
        type: boolean
        default: false
      force:
        description: "Forceer bouwen ook in oneven week?"
        type: boolean
        default: false
      test_to:
        description: "Test: stuur ALLE edities naar dit adres i.p.v. de echte ontvangers (leeg = normaal)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM || 'eräSauna Intelligence <intel@erasauna.nl>' }}
      FILTER_MODEL: ${{ vars.FILTER_MODEL || 'gemini-3.1-flash-lite' }}
      READER_MODEL: ${{ vars.READER_MODEL || 'gemini-3.6-flash' }}
      AUDIT_MODEL: ${{ vars.AUDIT_MODEL || 'gemini-3.6-flash' }}
      EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'claude-opus-4-8' }}
      MONTHLY_CAP_USD: ${{ vars.MONTHLY_CAP_USD || '15' }}
      AUDIT_SAMPLE_SIZE: ${{ vars.AUDIT_SAMPLE_SIZE || '20' }}
      FORCE_EDITION: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Hoofdmail (NL/BE/FR/DE + trendwatch)
        env:
          PROFILE: main
          NEWSLETTER_TO_DEFAULT: info@erasauna.nl
        run: |
          OUT=$(node run-edition.mjs); echo "$OUT"
          DIR=$(echo "$OUT" | sed -n 's/^EDITIONDIR=//p'); SUBJ=$(echo "$OUT" | sed -n 's/^SUBJECT=//p')
          [ -z "$DIR" ] && { echo "geen editie deze week"; exit 0; }
          python3 md-to-email.py "$DIR/newsletter.md" > "$DIR/newsletter.html"
          if [ "${{ github.event_name == 'schedule' || inputs.send == 'true' }}" = "true" ]; then
            TO="${{ inputs.test_to }}"; [ -z "$TO" ] && TO="$NEWSLETTER_TO_DEFAULT"
            NEWSLETTER_TO="$TO" node send-newsletter.mjs "$DIR/newsletter.html" "$SUBJ"
          fi

      - name: Frankrijk-editie (Frans)
        continue-on-error: true
        env:
          PROFILE: fr
          NEWSLETTER_TO_DEFAULT: ${{ vars.NEWSLETTER_TO_FR || 'larsdehaan09@gmail.com' }},info@erasauna.nl
        run: |
          OUT=$(node run-edition.mjs); echo "$OUT"
          DIR=$(echo "$OUT" | sed -n 's/^EDITIONDIR=//p'); SUBJ=$(echo "$OUT" | sed -n 's/^SUBJECT=//p')
          [ -z "$DIR" ] && { echo "geen editie deze week"; exit 0; }
          python3 md-to-email.py "$DIR/newsletter.md" > "$DIR/newsletter.html"
          if [ "${{ (github.event_name == 'schedule' && vars.AUTOSEND_PARTNERS == 'true') || inputs.send == 'true' }}" = "true" ]; then
            TO="${{ inputs.test_to }}"; [ -z "$TO" ] && TO="$NEWSLETTER_TO_DEFAULT"
            NEWSLETTER_TO="$TO" node send-newsletter.mjs "$DIR/newsletter.html" "$SUBJ"
          fi

      - name: Duitsland-editie (Duits)
        continue-on-error: true
        env:
          PROFILE: de
          NEWSLETTER_TO_DEFAULT: ${{ vars.NEWSLETTER_TO_DE }},info@erasauna.nl
        run: |
          OUT=$(node run-edition.mjs); echo "$OUT"
          DIR=$(echo "$OUT" | sed -n 's/^EDITIONDIR=//p'); SUBJ=$(echo "$OUT" | sed -n 's/^SUBJECT=//p')
          [ -z "$DIR" ] && { echo "geen editie deze week"; exit 0; }
          python3 md-to-email.py "$DIR/newsletter.md" > "$DIR/newsletter.html"
          if [ "${{ (github.event_name == 'schedule' && vars.AUTOSEND_PARTNERS == 'true') || inputs.send == 'true' }}" = "true" ]; then
            TO="${{ inputs.test_to }}"; [ -z "$TO" ] && TO="$NEWSLETTER_TO_DEFAULT"
            NEWSLETTER_TO="$TO" node send-newsletter.mjs "$DIR/newsletter.html" "$SUBJ"
          fi

      - name: Archiveer alle edities
        run: |
          git config user.name "eräSauna"
          git config user.email "info@erasauna.nl"
          git add state/
          git commit -m "edities $(date -u +%F)" || echo "geen wijzigingen"
          git push || echo "push overgeslagen"

      - name: Upload edities als artifact
        uses: actions/upload-artifact@v4
        with:
          name: newsletters
          path: state/
