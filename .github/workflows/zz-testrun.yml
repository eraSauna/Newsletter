name: Newsletter testrun (tijdelijk)

# Tijdelijke, handmatige testrun. Draait op de push die dit bestand toevoegt.
# Bouwt alle drie de edities in backlog-modus (Variable BACKLOG_SINCE) en stuurt
# ze ALLEMAAL naar info@erasauna.nl — dus niets naar externe partners.
# Wordt na de test weer verwijderd.

on:
  push:
    paths:
      - ".github/workflows/zz-testrun.yml"

permissions:
  contents: read

jobs:
  testrun:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM || 'eräSauna Intelligence <intel@erasauna.nl>' }}
      FILTER_MODEL: ${{ vars.FILTER_MODEL || 'gemini-3.1-flash-lite' }}
      READER_MODEL: ${{ vars.READER_MODEL || 'gemini-3.6-flash' }}
      AUDIT_MODEL: ${{ vars.AUDIT_MODEL || 'gemini-3.6-flash' }}
      EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'claude-opus-4-8' }}
      MONTHLY_CAP_USD: ${{ vars.MONTHLY_CAP_USD || '15' }}
      AUDIT_SAMPLE_SIZE: ${{ vars.AUDIT_SAMPLE_SIZE || '20' }}
      BACKLOG_SINCE: ${{ vars.BACKLOG_SINCE }}
      FORCE_EDITION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Bouw en verstuur alle drie naar info@erasauna.nl
        run: |
          for P in main fr de; do
            echo "===== profiel $P ====="
            OUT=$(PROFILE=$P node run-edition.mjs); echo "$OUT"
            DIR=$(echo "$OUT" | sed -n 's/^EDITIONDIR=//p'); SUBJ=$(echo "$OUT" | sed -n 's/^SUBJECT=//p')
            if [ -z "$DIR" ]; then echo "geen editie voor $P"; continue; fi
            python3 md-to-email.py "$DIR/newsletter.md" > "$DIR/newsletter.html"
            NEWSLETTER_TO="info@erasauna.nl" node send-newsletter.mjs "$DIR/newsletter.html" "$SUBJ"
          done
